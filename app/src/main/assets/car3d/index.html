<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:transparent;overflow:hidden;height:100%}canvas{display:block;width:100vw;height:100vh;background:transparent}</style></head>
<body><canvas id="cv"></canvas>
<script type="module">
// The live Ocean (digital twin 2.3.3): one GLB, controlled by name. Coordinates: metres, +Y up, +X car right, -Z forward; positive yaw = left turn.
// The app sends its state with car3d.set({...}); this page owns smoothing, the lamp materials, openings, wheels, paint and the solar gradient.
import * as THREE from './three.module.min.js';
import {GLTFLoader} from './GLTFLoader.js';
const bridge=window.CarBridge||{ready(){},fail(){}};
try{
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,premultipliedAlpha:true});
renderer.setClearColor(0x000000,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xf2f5fa,0x53606d,2.1));
const key=new THREE.DirectionalLight(0xf1f5fa,.75);key.position.set(-3,6,4);scene.add(key);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.05,100);cam.up.set(0,0,-1);
const target=new THREE.Vector3(0,.55,0);
// viewer mode (?viewer=1): the car on its own, turned by dragging and zoomed by pinching, seen by a normal perspective camera (and the standard-detail model)
const VIEWER=/viewer=1/.test(location.search);
const pcam=new THREE.PerspectiveCamera(32,1,.1,200),ORB0={th:.6,ph:1.25,d:11},orb={th:.6,ph:1.25,d:11,auto:false},vt=new THREE.Vector3(0,.7,0);
if(VIEWER){{const q=new URLSearchParams(location.search);for(const k of['th','ph','d'])if(q.has(k)){orb[k]=ORB0[k]=parseFloat(q.get(k))}}
  cv.style.touchAction='none';const ps=new Map();let pd=0;
  const clamp=()=>{orb.ph=Math.max(.05,Math.min(Math.PI-.05,orb.ph));orb.d=Math.max(4.5,Math.min(22,orb.d))};
  cv.addEventListener('pointerdown',e=>{moving();cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ps.size===2){const a=[...ps.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
  cv.addEventListener('pointermove',e=>{const q=ps.get(e.pointerId);if(!q)return;
    if(ps.size===1){orb.th-=(e.clientX-q.x)*.009;orb.ph-=(e.clientY-q.y)*.009}
    q.x=e.clientX;q.y=e.clientY;
    if(ps.size===2){const a=[...ps.values()],n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd>0&&n>0)orb.d*=pd/n;pd=n}
    clamp();dirty=true});
  const up=e=>{ps.delete(e.pointerId);pd=0;if(ps.size===0)settled()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}

// ---- state sent by the app (all optional; -1 = no signal)
const st={speed:0,head:0,tail:false,turn:0,brake:false,left:false,right:false,rev:false,follow:true,red:false,paint:'silver-lining',wheel:'F3A_22',
  open:{fl:0,fr:0,rl:0,rr:0,tg:0,sr:-1,hd:-1},solar:-1,solarStart:'#205a80',solarEnd:'#42c8a0'};
let tilt=0,spin=0,last=performance.now(),lastDraw=0,dirty=true,loaded=false,size=0,yaw=0,steer=0,firstOpen=true;
const smooth=x=>x*x*(3-2*x);
// how the app's own picture is tuned (kept from the previous model): driving beam length, daytime-lamp strengths, yaw follow
const BEAM_LEN=2.94,DRL_BRIGHT=.35,DRL_LEN=.8,DRL_LAMP=.4,YAW_K=.5,YAW_MAX=14,IND_GLOW=.4,IND_GLOW_SIZE=.85;
// contract 2.3.3 lighting strengths and linear colours
const L={tail:.4,brake:7,centre:10,dip:2,high:5,ind:4,rev:4};
const C={head:[.90,.96,1],tail:[1,.007,.012],rev:[.85,.95,1],ind:[1,.025,.001],indRed:[1,.007,.012]};
const TWIN_RADIUS=.39415;

// ---- bound parts (resolved by name)
const nodes=new Map(),rest=new Map(),mats=new Map();
let model=null,twin={wheels:[],paints:[]},wheelPre=null,solarTex=null;
const node=n=>nodes.get(n);
const eachMat=(n,f)=>{for(const m of mats.get(n)||[])f(m)};
const AX=new THREE.Vector3(1,0,0),AY=new THREE.Vector3(0,1,0),_q=new THREE.Quaternion();
const rot=(n,axis,rad)=>{const o=node(n),r=o&&rest.get(o);if(!o||!r)return;_q.setFromAxisAngle(axis,rad);o.quaternion.copy(r.q).multiply(_q)};      // absolute: the imported rest rotation, then this turn about the part's own axis
const move=(n,x,y,z)=>{const o=node(n),r=o&&rest.get(o);if(!o||!r)return;o.position.set(r.p.x+x,r.p.y+y,r.p.z+z)};
const emitCache={};
const em=(n,c,k)=>{const x=c[0]*k,y=c[1]*k,z=c[2]*k,o=emitCache[n];if(o&&o[0]===x&&o[1]===y&&o[2]===z)return;emitCache[n]=[x,y,z];eachMat(n,m=>{if(m.emissive){m.emissive.setRGB(x,y,z);m.emissiveIntensity=1}})};

// ---- paint: sRGB hex -> linear, then 0.022 + 0.978 * value once per channel (the GLB's default paint is already lifted); calm matte finish
const _c=new THREE.Color();let paintKey='';
function paint(){
  const id=String(st.paint||'').toLowerCase().replace(/grey/g,'gray').replace(/[^a-z0-9#]+/g,'-').replace(/^-|-$/g,'');
  const p=twin.paints.find(q=>q.id===id);
  const hex=p?p.hex:(/^#[0-9a-f]{6}$/i.test(st.paint)?st.paint:'#a5adb6');
  const metal=Math.min(.12,p?p.metallic:.1),rough=Math.max(.7,p?p.roughness:.76);
  const k=hex+metal+rough;if(k===paintKey)return;paintKey=k;
  _c.set(hex);const r=.022+.978*_c.r,g=.022+.978*_c.g,b=.022+.978*_c.b;
  eachMat('Paint_Body',m=>{m.color.setRGB(r,g,b);m.metalness=metal;m.roughness=rough;if('clearcoat'in m)m.clearcoat=0})}

// ---- wheels: one family per hub, accent finish on its own material only; tyre radius sets spin and ride height
function wheels(){
  const w=twin.wheels.find(q=>q.id===st.wheel)||twin.wheels[0];if(!w||w===wheelPre)return;wheelPre=w;
  for(const c of['FL','FR','RL','RR'])for(const f of['F3','F5','F6','F7']){const n=node('WheelStyle_'+f+'_'+c);if(n){n.visible=f===w.family;n.scale.set(1,1,1)}}
  eachMat(w.accent_material,m=>{m.color.set(w.accent_hex);m.roughness=w.accent_roughness});dirty=true}

// ---- openings: the contract's four doors, hatch, front roof panel and handles; smoothed 180 ms, absolute offsets from the rest pose
const open={fl:0,fr:0,rl:0,rr:0,tg:0,sr:0,hd:0};
const fr=x=>Number.isFinite(x)&&x>0?Math.min(1,x):0;
let openMoving=false;
function openings(dt,snap){
  const T={fl:fr(st.open.fl),fr:fr(st.open.fr),rl:fr(st.open.rl),rr:fr(st.open.rr),tg:fr(st.open.tg),sr:fr(st.open.sr),hd:fr(st.open.hd)};
  const b=snap?1:1-Math.exp(-Math.min(.05,dt)/.18);openMoving=false;
  for(const k in T){open[k]+=(T[k]-open[k])*b;if(Math.abs(T[k]-open[k])<.001)open[k]=T[k];else openMoving=true}
  const D=Math.PI/180;
  rot('Hinge_Door_FL',AY,-68*D*open.fl);rot('Hinge_Door_FR',AY,68*D*open.fr);rot('Hinge_Door_RL',AY,-68*D*open.rl);rot('Hinge_Door_RR',AY,68*D*open.rr);
  rot('Hinge_Tailgate',AX,-82*D*open.tg);
  move('Slide_Handle_FL',-.035*open.hd,0,0);move('Slide_Handle_RL',-.035*open.hd,0,0);move('Slide_Handle_FR',.035*open.hd,0,0);move('Slide_Handle_RR',.035*open.hd,0,0);
  const lift=Math.min(1,open.sr/.18),slide=Math.max(0,Math.min(1,(open.sr-.18)/.82));
  move('Slide_Sunroof_Front',0,.06*lift,.922*slide)}

// ---- solar roof: ONE small texture shared by every instance of both solar materials (so by both roof halves); the colour field never restarts at the seam.
// Power colour scale (as the car's own SolarSky screen): 0 W green -> cyan -> orange / red at the configured full-scale power (250 W). While the roof makes power, a pulse of that colour
// runs along the circuit traces from the two outer ends of the roof toward the middle (u is continuous along the roof, so "distance from the nearest end" is the same on both halves).
const NEUTRAL=new THREE.Color('#293b48'),_t=new THREE.Color(),_s=new THREE.Color();let cellTex=null,solarKey='',solarOn=false,lastSolar=0;
const SCALE=[[0,'#3ad82a'],[.12,'#3ad82a'],[.26,'#28c8f0'],[.62,'#28c8f0'],[.70,'#ff9a40'],[1,'#ff4818']].map(a=>[a[0],new THREE.Color(a[1])]);
function scaleColor(f,out){let i=1;while(i<SCALE.length-1&&f>SCALE[i][0])i++;const a=SCALE[i-1],b=SCALE[i];return out.copy(a[1]).lerp(b[1],Math.max(0,Math.min(1,(f-a[0])/(b[0]-a[0]))))}
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function solar(now){
  if(!solarTex)return;
  const p=st.solar,ok=Number.isFinite(p)&&p>=0,f=ok?Math.min(1,p):0;solarOn=ok&&f>.004;
  const T=2.6-1.1*f,ph=((now||0)/1000/T%1)*1.3;                   // faster pulses at higher power; a short rest between sweeps
  const k=ok?(solarOn?f.toFixed(3)+'|'+(ph*60|0):'z'+f):'n';
  if(k===solarKey)return;solarKey=k;
  const d=solarTex.image.data;scaleColor(f,_s);
  const dc=cellTex.image.data;
  for(let x=0;x<256;x++){
    // the traces (shared texture): dim line colour, with the pulse running over it
    if(!ok)_t.copy(NEUTRAL);
    else if(!solarOn)_t.copy(_s).multiplyScalar(.35);
    else{const u=x/255,dd=Math.min(u,1-u)*2,e=(dd-ph)/.07,I=Math.exp(-e*e)*(1-sm(.95,1.3,ph));
      _t.copy(_s).multiplyScalar(.18+.82*I);_t.lerp(_s.clone().lerp(new THREE.Color(1,1,1),.45),I*.55)}
    _t.convertLinearToSRGB();
    for(let y=0;y<2;y++){const i=(y*256+x)*4;d[i]=Math.round(_t.r*255);d[i+1]=Math.round(_t.g*255);d[i+2]=Math.round(_t.b*255);d[i+3]=255}
    // the cells: one steady colour, no animation
    _t.copy(ok?_s:NEUTRAL).multiplyScalar(ok?.32:1).convertLinearToSRGB();
    for(let y=0;y<2;y++){const i=(y*256+x)*4;dc[i]=Math.round(_t.r*255);dc[i+1]=Math.round(_t.g*255);dc[i+2]=Math.round(_t.b*255);dc[i+3]=255}}
  cellTex.needsUpdate=true;
  solarTex.needsUpdate=true;dirty=true}
function mkTex(){const t=new THREE.DataTexture(new Uint8Array(256*2*4),256,2,THREE.RGBAFormat);t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=t.minFilter=THREE.LinearFilter;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.generateMipmaps=false;return t}
function setupSolar(){
  solarTex=mkTex();cellTex=mkTex();
  const old=new Set();
  eachMat('Mat_SolarPower',m=>{if(m.map&&m.map!==solarTex)old.add(m.map);m.map=solarTex;m.needsUpdate=true});
  eachMat('Mat_SolarCells',m=>{if(m.map&&m.map!==cellTex)old.add(m.map);m.map=cellTex;m.needsUpdate=true});   // the cells keep their own steady colour: only the lines animate
  for(const t of old)t.dispose();solarKey='';solar(performance.now())}

// ---- lamps: contract emission values per material; the car's own indicator flash is used as is (no second blink)
const beams={Dipped:[],High:[]},glows={};
function lamps(){
  const head=st.head,dip=head===1||head===2,high=head===2,drl=head===3;
  const front=dip?L.dip+(high?L.high:0):(drl?L.dip*DRL_LAMP:0);
  for(const s of['L','R']){em('Mat_Head_'+s,C.head,front);em('Mat_Tail_'+s,C.tail,st.brake?L.brake:(st.tail?L.tail:0));em('Mat_Reverse_'+s,C.rev,st.rev?L.rev:0)}
  em('Mat_Brake_Centre',C.tail,st.brake?L.centre:0);
  const ic=st.red?C.indRed:C.ind;em('Mat_Indicator_L',ic,st.left?L.ind:0);em('Mat_Indicator_R',ic,st.right?L.ind:0);
  const gs=(s,o)=>{if(s)s.material.opacity=o};
  gs(glows.brakeC,st.brake?.95:0);for(const s of['tailL','tailR'])gs(glows[s],st.brake?.855:(st.tail?.25:0));
  for(const k in glows){const g=glows[k];if(g&&g.userData.side){g.material.color.setHex(st.red?0xff2a1a:0xff7a10);g.material.opacity=(g.userData.side==='L'?st.left:st.right)?IND_GLOW:0}}
  // the road-light cards (low beam: wide soft fan; high beam adds a longer, narrower one); driving stretches them forward from the lamp. They are blended, depth-tested and never write depth.
  for(const k of['Dipped','High']){const on=k==='Dipped'?(dip||drl):high;
    for(const b of beams[k]){b.visible=on;
      if(on){const sz=(1+(BEAM_LEN-1)*tilt)*(drl&&k==='Dipped'?DRL_LEN:1),pz=b.userData.pz;b.scale.set(1,1,sz);b.position.z=b.userData.z0+pz*(1-sz)}
      else b.scale.setScalar(0)}
    eachMat('Beam_'+k,m=>{m.transparent=true;m.depthTest=true;m.depthWrite=false;m.color.set('#e8f5ff');
      m.opacity=on?(k==='High'?.8:(drl?.7*DRL_BRIGHT:.7)):0;if(m.emissive){m.emissive.setRGB(.65,.75,1);m.emissiveIntensity=on?(k==='High'?2.2:(drl?1.4*DRL_BRIGHT:1.4)):0}})}
}

// ---- full-screen viewer: drawn at 2.5-3x the screen's pixels and scaled down; at the normal 1-2x while a finger is moving it, sharp again 0.3 s after
let qHi=true,qT=0;
function pxr(){const dpr=window.devicePixelRatio||1;if(!VIEWER||!qHi)return Math.min(dpr,2);const w=cv.clientWidth,h=cv.clientHeight;return Math.max(1,Math.min(3,Math.max(dpr*1.5,2.5),Math.sqrt(7.5e6/Math.max(1,w*h))))}
function setQ(hi){if(!VIEWER||qHi===hi)return;qHi=hi;size='';resize()}
function moving(){clearTimeout(qT);setQ(false)}
function settled(){clearTimeout(qT);qT=setTimeout(()=>{if(!orb.auto)setQ(true)},300)}
function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const r=pxr();if(size!==w*1000+h){size=w*1000+h;renderer.setPixelRatio(r);renderer.setSize(w,h,false);dirty=true}}
window.car3d={set(o){
  for(const k in o){if(k==='open'){Object.assign(st.open,o.open)}else st[k]=o[k]}
  if(loaded){paint();wheels();solar(performance.now());if(firstOpen&&o.open){firstOpen=false;openings(0,true)}}dirty=true},
  reset(){Object.assign(orb,ORB0,{auto:false});dirty=true},auto(b){orb.auto=!!b;if(orb.auto)moving();else settled();dirty=true},
  info(){return{loaded,wheel:wheelPre&&wheelPre.id,open:{...open},yaw,steer,tilt,calls:renderer.info.render.calls,tris:renderer.info.render.triangles,tex:renderer.info.memory.textures,geo:renderer.info.memory.geometries}}};

fetch('./'+(VIEWER?'ocean.glb':'ocean-lite.glb')).then(r=>{if(!r.ok)throw new Error('model '+r.status);return r.arrayBuffer()}).then(buf=>{
new GLTFLoader().parse(buf,'',g=>{
  try{
  model=g.scene;scene.add(model);
  const ex=g.parser.json.asset.extras&&g.parser.json.asset.extras.digitalTwin;if(!ex||!ex.wheelOptions||!ex.paintPresets)throw new Error('no wheel/paint data in the model');
  twin={wheels:ex.wheelOptions,paints:ex.paintPresets};
  model.traverse(o=>{
    if(o.name&&!nodes.has(o.name))nodes.set(o.name,o);
    rest.set(o,{p:o.position.clone(),q:o.quaternion.clone()});
    if(o.isMesh){for(const m of Array.isArray(o.material)?o.material:[o.material]){if(!mats.has(m.name))mats.set(m.name,new Set());mats.get(m.name).add(m)}}
    if(o.isLight||/^(Spot_|HeadAnchor_)/.test(o.name))o.visible=false;       // the supplied spotlights stay off (the cards below are the road light)
    if(o.isCamera)o.visible=false});
  const need=['VehicleYaw','Steer_FL','Steer_FR','Roll_FL','Roll_FR','Roll_RL','Roll_RR','Hinge_Door_FL','Hinge_Door_FR','Hinge_Door_RL','Hinge_Door_RR','Hinge_Tailgate','Slide_Sunroof_Front','Slide_Handle_FL','Slide_Handle_FR','Slide_Handle_RL','Slide_Handle_RR','Lamp_Brake_Centre'];
  const miss=need.filter(n=>!nodes.has(n));if(miss.length)throw new Error('model parts missing: '+miss.join(','));
  const mneed=['Paint_Body','Mat_Head_L','Mat_Tail_L','Mat_Indicator_L','Mat_Reverse_L','Mat_Brake_Centre','Mat_SolarCells','Mat_SolarPower'].filter(n=>!mats.has(n));if(mneed.length)throw new Error('model materials missing: '+mneed.join(','));
  model.updateMatrixWorld(true);
  // beam cards: rest scale 0 in the file -> unit scale, hidden until used; remember the lamp end of each so driving can stretch it forward
  for(const k of['Dipped','High'])for(const s of['L','R']){const b=node('Beam_'+k+'_'+s);if(!b)continue;b.visible=false;b.scale.set(0,0,0);
    const bx=new THREE.Box3();b.scale.set(1,1,1);b.updateMatrixWorld(true);bx.setFromObject(b);b.userData.pz=bx.max.z-b.position.z;b.userData.z0=b.position.z;b.scale.set(0,0,0);beams[k].push(b)}
  const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(gr&&c)})();
  // soft glows on the lamps (the page has no bloom pass: the view must stay transparent over the dashboard): a sprite on the lamp part, parented to what carries it
  const spr=(parent,world,color,sz,sy,side)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,blending:THREE.AdditiveBlending,depthTest:true,depthWrite:false,opacity:0}));
    s.position.copy(parent.worldToLocal(world.clone()));s.scale.set(sz,sy||sz,1);s.renderOrder=10;if(side)s.userData.side=side;parent.add(s);return s};
  const centre=n=>new THREE.Box3().setFromObject(node(n)).getCenter(new THREE.Vector3());
  glows.brakeC=spr(node('Hinge_Tailgate'),centre('Lamp_Brake_Centre'),0xff2a1a,1.155,.3);
  glows.tailL=spr(node('VehicleYaw'),centre('Lamp_Tail_L'),0xff2a1a,.7);glows.tailR=spr(node('VehicleYaw'),centre('Lamp_Tail_R'),0xff2a1a,.7);
  // rear turn-signal glows: the amber patches are regions of Body_Main (also front, mirror, pillar): take the rear half (z > 0) of each side's patch
  {let n=0;model.traverse(o=>{if(!o.isMesh)return;const mm=/^Mat_Indicator_([LR])$/.exec(o.material.name||'');if(!mm)return;
    const P=o.geometry.attributes.position,bx=new THREE.Box3(),v=new THREE.Vector3();o.updateWorldMatrix(true,false);
    for(let i=0;i<P.count;i++){v.fromBufferAttribute(P,i).applyMatrix4(o.matrixWorld);if(v.z>1)bx.expandByPoint(v)}if(bx.isEmpty())return;
    glows['ind'+(n++)]=spr(node('VehicleYaw'),bx.getCenter(new THREE.Vector3()),0xff7a10,IND_GLOW_SIZE,IND_GLOW_SIZE,mm[1])})}
  setupSolar();paint();wheels();
  loaded=true;bridge.ready();requestAnimationFrame(loop);
  }catch(e){bridge.fail('bind: '+e.message)}
},e=>bridge.fail('model: '+(e&&e.message)))}).catch(e=>bridge.fail('load: '+e.message));

function loop(now){
  requestAnimationFrame(loop);
  if(now-lastDraw<33)return;                          // about 30 fps
  const dt=Math.min(.1,(now-last)/1000);last=now;lastDraw=now;
  const g=smooth(Math.min(1,st.speed/10));
  const w=wheelPre?wheelPre.radius_m:TWIN_RADIUS;
  const wantYaw=!st.follow?0:Math.max(-YAW_MAX,Math.min(YAW_MAX,st.turn*YAW_K));       // the car body turns toward the road bend (positive = right here)
  const moving=st.speed>.5,settling=Math.abs(tilt-g)>.003||Math.abs(yaw-wantYaw)>.02||Math.abs(steer-st.turn)>.05,blinking=false;
  resize();     // a bigger or smaller view must be redrawn even when idle, or the old small picture is stretched
  if(solarOn&&now-lastSolar>50){lastSolar=now;solar(now)}
  if(!(moving||settling||openMoving||dirty||(VIEWER&&orb.auto)))return;     // idle: draw nothing
  tilt+=(g-tilt)*Math.min(1,dt*1.1);if(Math.abs(tilt-g)<.004)tilt=g;
  if(moving){spin=(spin-st.speed/3.6*dt/w)%(2*Math.PI)}
  for(const c of['FL','FR','RL','RR'])rot('Roll_'+c,AX,spin);
  const b=1-Math.exp(-dt/.12);steer+=(Math.max(-35,Math.min(35,st.turn))-steer)*b;if(Math.abs(steer-st.turn)<.02)steer=Math.max(-35,Math.min(35,st.turn));
  for(const c of['FL','FR'])rot('Steer_'+c,AY,-steer*Math.PI/180);                // positive turn = right = a negative (clockwise) yaw
  yaw+=(wantYaw-yaw)*Math.min(1,dt*(Math.abs(wantYaw)<Math.abs(yaw)?9:5));if(Math.abs(yaw-wantYaw)<.02)yaw=wantYaw;
  rot('VehicleYaw',AY,-yaw*Math.PI/180*tilt);{const o=node('VehicleYaw'),r=rest.get(o);o.position.y=r.p.y+(w-TWIN_RADIUS)}
  openings(dt,false);lamps();
  if(VIEWER){if(orb.auto)orb.th+=dt*.6;const sp=Math.sin(orb.ph);pcam.aspect=cv.clientWidth/Math.max(1,cv.clientHeight);pcam.updateProjectionMatrix();
    pcam.position.set(vt.x+orb.d*sp*Math.sin(orb.th),vt.y+orb.d*Math.cos(orb.ph),vt.z+orb.d*sp*Math.cos(orb.th));pcam.lookAt(vt);renderer.render(scene,pcam);dirty=false;return}
  const pitch=90+(24-90)*tilt,H=(7.4+(5.0-7.4)*tilt)*150/162/1.2,rad=pitch*Math.PI/180;
  const wr=cv.clientWidth/(cv.clientHeight*150/270)||1;cam.left=-H/2*wr;cam.right=H/2*wr;     // the view is wider than the car square, so the headlight beams are not cut off at its sides
  cam.top=H/2+H*120/150;cam.bottom=-H/2;cam.updateProjectionMatrix();
  cam.position.set(0,target.y+14*Math.sin(rad),14*Math.cos(rad));cam.lookAt(target);
  renderer.render(scene,cam);dirty=false;
}
}catch(e){bridge.fail('init: '+e.message)}
</script></body></html>
