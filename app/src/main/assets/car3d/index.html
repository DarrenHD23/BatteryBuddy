<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:transparent;overflow:hidden;height:100%}canvas{display:block;width:100vw;height:100vh;background:transparent}</style></head>
<body><canvas id="cv"></canvas>
<script type="module">
import * as THREE from './three.module.min.js';
import {GLTFLoader} from './GLTFLoader.js';
import B64 from './model.js';
const bridge=window.CarBridge||{ready(){},fail(){}};
try{
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,premultipliedAlpha:true});
renderer.setClearColor(0x000000,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xf2f5fa,0x53606d,2.1));
const key=new THREE.DirectionalLight(0xf1f5fa,.75);key.position.set(-3,6,4);scene.add(key);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.05,100);cam.up.set(0,0,-1);
const target=new THREE.Vector3(0,.55,0);
const mats=new Map(),rolls=[],steers=[],beams={Dipped:[],High:[]},glows={};let brakeMesh=null;
let st={speed:0,head:0,turn:0,brake:false,left:false,right:false,rev:false,paint:'#e7e8e3'},tilt=0,spin=0,last=performance.now(),lastDraw=0,dirty=true,loaded=false,size=0;
const smooth=x=>x*x*(3-2*x);
const WHEEL_W=.49,WHEEL_S=.81,STEER_K=.93,BEAM_LEN=2.94,BODY_K=.18,BODY_S=.35;     // wheel width / size, how far they turn, driving beam length (parked is 1)
const em=(n,c,k)=>{for(const m of mats.get(n)||[])if(m.emissive){m.emissive.setRGB(...c);m.emissiveIntensity=k}};
let Z0=0,Z1=1,lastK=-1;const deform=[],nodes=[],_v=new THREE.Vector3(),_m=new THREE.Matrix4();
const ramp=z=>{const t=(Z1-z)/(Z1-Z0),u=Math.min(1,Math.max(0,(t-BODY_S)/(1-BODY_S)));return u*u*(3-2*u)};
function applyBody(){
  const k=BODY_K*tilt;if(Math.abs(k-lastK)<1e-4)return;lastK=k;
  for(const o of deform){const base=o.userData.base,pos=o.geometry.attributes.position,M=o.matrixWorld;_m.copy(M).invert();
    for(let i=0;i<pos.count;i++){_v.set(base[i*3],base[i*3+1],base[i*3+2]).applyMatrix4(M);_v.x*=1-k*ramp(_v.z);_v.applyMatrix4(_m);pos.setXYZ(i,_v.x,_v.y,_v.z)}
    pos.needsUpdate=true;o.geometry.computeVertexNormals()}
  for(const n of nodes){const z=n.userData.wz!==undefined?n.userData.wz:n.userData.bz,x0=n.userData.x!==undefined?n.userData.x:n.userData.bx;n.userData.fx=x0*(1-k*ramp(z))}
  for(const n of nodes)if(n.name.startsWith('Steer_'))n.position.x=n.userData.fx;
}
function lamps(now){
  const blink=Math.floor(now/380)%2===0,dip=st.head>=1,high=st.head===2;
  for(const s of['L','R']){em('Mat_Head_'+s,[.9,.96,1],dip?2+(high?5:0):0);em('Mat_Tail_'+s,[1,.03,.02],st.brake?3:(dip?1:0));em('Mat_Reverse_'+s,[1,1,1],st.rev?2.5:0)}
  em('Mat_Brake_Centre',[1,.03,.02],st.brake?3:0);
  const gs=(s,o)=>{if(s)s.material.opacity=o};
  gs(glows.brakeC,st.brake?1:0);gs(glows.tailL,st.brake?.9:(dip?.25:0));gs(glows.tailR,st.brake?.9:(dip?.25:0));
  // the model's own light beams (low beam: wide soft fan; high beam adds two long strips); no extra glow on the hood
  for(const k of['Dipped','High']){const on=k==='Dipped'?dip:high;
    for(const b of beams[k]){b.visible=on;
      if(on){if(!b.userData.p){b.scale.setScalar(1);b.updateMatrixWorld(true);const bx=new THREE.Box3().setFromObject(b);b.userData.p={pos:b.position.clone(),pz:bx.max.z}}
        const q=b.userData.p,sz=1+(BEAM_LEN-1)*tilt;b.scale.set(1,1,sz);b.position.set(q.pos.x+(b.userData.fx!==undefined?b.userData.fx-b.userData.bx:0),q.pos.y,q.pz+(q.pos.z-q.pz)*sz)}      // driving: the beam stretches forward from the lamp
      else b.scale.setScalar(0)}
    for(const m of mats.get('Beam_'+k)||[]){m.transparent=true;m.opacity=on?(k==='High'?.8:.7):0;m.color.set('#e8f5ff');if(m.emissive){m.emissive.setRGB(.65,.75,1);m.emissiveIntensity=on?(k==='High'?2.2:1.4):0}m.depthWrite=false}}
  em('Mat_Indicator_L',[1,.45,0],st.left&&blink?3:0);em('Mat_Indicator_R',[1,.45,0],st.right&&blink?3:0);
}
function paint(){for(const m of mats.get('Paint_Body')||[]){m.color.set(st.paint);m.metalness=.1;m.roughness=.76;if('clearcoat'in m)m.clearcoat=0}}
function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const r=Math.min(window.devicePixelRatio||1,2);if(size!==w*1000+h){size=w*1000+h;renderer.setPixelRatio(r);renderer.setSize(w,h,false);dirty=true}}
window.car3d={set(o){Object.assign(st,o);if(loaded&&o.paint)paint();dirty=true}};
const u8=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
new GLTFLoader().parse(u8.buffer,'',g=>{
  const model=g.scene;scene.add(model);
  model.traverse(o=>{if(o.isMesh){for(const m of Array.isArray(o.material)?o.material:[o.material]){if(!mats.has(m.name))mats.set(m.name,[]);mats.get(m.name).push(m)}}const mn=o.isMesh?(Array.isArray(o.material)?o.material:[o.material]).map(m=>m.name).join(' '):'';
    if(/Spot|Anchor/.test(o.name)||o.isLight)o.visible=false;
    const bm=/^Beam_(Dipped|High)_[LR]$/.exec(o.name);if(bm){beams[bm[1]].push(o);o.visible=false;o.scale.setScalar(0)}});
  model.updateMatrixWorld(true);
  // driving: the body narrows from partway along toward the nose (parked stays as is); front wheels and beams follow it in
  {const bb=new THREE.Box3().setFromObject(model);Z0=bb.min.z;Z1=bb.max.z;
   model.traverse(o=>{if(!o.isMesh)return;let p=o,skip=false;while(p){if(/^(Roll_|Steer_|Beam_)/.test(p.name)){skip=true;break}p=p.parent}
     if(skip)return;o.geometry=o.geometry.clone();o.userData.base=o.geometry.attributes.position.array.slice();deform.push(o)});
   for(const n of['FL','FR']){const o=model.getObjectByName('Steer_'+n);if(o){o.userData.x=o.position.x;o.userData.wz=new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).z;nodes.push(o)}}
   for(const k of['Dipped','High'])for(const b of beams[k]){b.userData.bx=b.position.x;b.userData.bz=new THREE.Box3().setFromObject(b).getCenter(new THREE.Vector3()).z;nodes.push(b)}}
  const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
  // soft glows on the lamps, always facing the camera, so the lights still show when the car is seen from straight above
  function glow(name,color,size,front,sy,rot){const n=model.getObjectByName(name);if(!n)return null;const b=new THREE.Box3().setFromObject(n),c=b.getCenter(new THREE.Vector3());if(front){c.z=b.min.z-.04;c.x+=(c.x<0?-1:1)*.14}       // front: put it on the very front edge of the lamp (forward is -Z)
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,opacity:0}));
    s.position.copy(c);s.scale.set(size,sy||size,1);if(rot)s.material.rotation=rot;s.renderOrder=10;scene.add(s);return s}
  glows.brakeC=glow("Lamp_Brake_Centre",0xff2a1a,.85,false,.3);brakeMesh=model.getObjectByName('Lamp_Brake_Centre');if(brakeMesh)brakeMesh.scale.x=1.3;glows.tailL=glow('Lamp_Tail_L',0xff2a1a,.7);glows.tailR=glow('Lamp_Tail_R',0xff2a1a,.7);
  for(const n of['FL','FR','RL','RR']){const o=model.getObjectByName('Roll_'+n);if(o){rolls.push(o);o.scale.set(WHEEL_W,WHEEL_S,WHEEL_S)}}
  for(const n of['FL','FR']){const o=model.getObjectByName('Steer_'+n);if(o)steers.push(o)}
  paint();loaded=true;bridge.ready();requestAnimationFrame(loop);
},e=>bridge.fail('model: '+(e&&e.message)));
function loop(now){
  requestAnimationFrame(loop);
  if(now-lastDraw<33)return;                          // about 30 fps
  const dt=Math.min(.1,(now-last)/1000);last=now;lastDraw=now;
  const g=smooth(Math.min(1,st.speed/10));
  const moving=st.speed>.5,settling=Math.abs(tilt-g)>.003,blinking=st.left||st.right;
  if(!(moving||settling||blinking||dirty))return;     // idle: draw nothing
  tilt+=(g-tilt)*Math.min(1,dt*1.1);if(Math.abs(tilt-g)<.004)tilt=g;
  if(moving){spin-=st.speed/3.6/0.38*dt;for(const r of rolls)r.rotation.x=spin}
  const steer=Math.max(-28,Math.min(28,st.turn))*STEER_K;for(const o of steers)o.rotation.y=-steer*Math.PI/180;     // positive = right turn
  resize();applyBody();lamps(now);
  const pitch=90+(24-90)*tilt,H=(7.4+(5.0-7.4)*tilt)*150/162/1.2,rad=pitch*Math.PI/180;
  cam.left=-H/2;cam.right=H/2;cam.top=H/2+H*120/150;cam.bottom=-H/2;cam.updateProjectionMatrix();
  cam.position.set(0,target.y+14*Math.sin(rad),14*Math.cos(rad));cam.lookAt(target);
  renderer.render(scene,cam);dirty=false;
}
}catch(e){bridge.fail('init: '+e.message)}
</script></body></html>
