<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><canvas id="cv"></canvas>
<script type="module">
// The live Ocean (digital twin 2.3.3): one GLB, controlled by name. Coordinates: metres, +Y up, +X car right, -Z forward; positive yaw = left turn.
// The app sends its state with car3d.set({...}); this page owns smoothing, the lamp materials, openings, wheels, paint and the solar gradient.
import * as THREE from './three.module.min.js';
import {GLTFLoader} from './GLTFLoader.js';
const bridge=window.CarBridge||{ready(){},fail(){}};
try{
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,premultipliedAlpha:true});
renderer.setClearColor(0x000000,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xf2f5fa,0x53606d,2.1));
const key=new THREE.DirectionalLight(0xf1f5fa,.75);key.position.set(-3,6,4);scene.add(key);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.05,100);cam.up.set(0,0,-1);
const target=new THREE.Vector3(0,.55,0);
// viewer mode (?viewer=1): the car on its own, turned by dragging and zoomed by pinching, seen by a normal perspective camera (and the standard-detail model)
const VIEWER=/viewer=1/.test(location.search);
const pcam=new THREE.PerspectiveCamera(32,1,.1,200),ORB0={th:.6,ph:1.25,d:11},orb={th:.6,ph:1.25,d:11,auto:false},vt=new THREE.Vector3(0,.7,0);
if(VIEWER){{const q=new URLSearchParams(location.search);for(const k of['th','ph','d'])if(q.has(k)){orb[k]=ORB0[k]=parseFloat(q.get(k))}}
  cv.style.touchAction='none';const ps=new Map();let pd=0;
  const clamp=()=>{orb.ph=Math.max(.05,Math.min(Math.PI-.05,orb.ph));orb.d=Math.max(4.5,Math.min(22,orb.d))};
  cv.addEventListener('pointerdown',e=>{moving();cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ps.size===2){const a=[...ps.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
  cv.addEventListener('pointermove',e=>{const q=ps.get(e.pointerId);if(!q)return;
    if(ps.size===1){orb.th-=(e.clientX-q.x)*.009;orb.ph-=(e.clientY-q.y)*.009}
    q.x=e.clientX;q.y=e.clientY;
    if(ps.size===2){const a=[...ps.values()],n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd>0&&n>0)orb.d*=pd/n;pd=n}
    clamp();dirty=true});
  const up=e=>{ps.delete(e.pointerId);pd=0;if(ps.size===0)settled()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}

// ---- state sent by the app (all optional; -1 = no signal)
const st={bglow:true,speed:0,head:0,tail:false,turn:0,brake:false,left:false,right:false,rev:false,follow:true,red:false,paint:'silver-lining',wheel:'F3A_22',
  open:{fl:0,fr:0,rl:0,rr:0,tg:0,sr:-1,hd:-1},solar:-1,solarStart:'#205a80',solarEnd:'#42c8a0'};
let tilt=0,spin=0,last=performance.now(),lastDraw=0,dirty=true,loaded=false,size=0,yaw=0,steer=0,firstOpen=true;
const smooth=x=>x*x*(3-2*x);
// how the app's own picture is tuned (kept from the previous model): driving beam length, daytime-lamp strengths, yaw follow
const BEAM_LEN=2.94,DRL_BRIGHT=.35,DRL_LEN=.8,DRL_LAMP=.4,YAW_K=.5,YAW_MAX=14,IND_GLOW=.4,IND_GLOW_SIZE=.85;
// contract 2.3.3 lighting strengths and linear colours
const L={tail:1,brake:3,centre:3,dip:2,high:5,ind:4,rev:4};
const L_MODEL={tail:.4,brake:7,centre:10},L_APP={tail:1,brake:3,centre:3};let glowMode=null;     // brake lights: the app's own look (wider centre light, softer glow over the body) or the model's own
function applyGlowMode(){glowMode=st.bglow;const app=st.bglow!==false;Object.assign(L,app?L_APP:L_MODEL);
  const lb=node('Lamp_Brake_Centre');if(lb){if(lb.userData.sx===undefined)lb.userData.sx=lb.scale.x;lb.scale.x=lb.userData.sx*(app?1.76:1)}
  for(const k of['brakeC','tailL','tailR']){const g=glows[k];if(g){g.material.depthTest=!app;g.material.needsUpdate=true}}dirty=true}
const C={head:[.90,.96,1],tail:[1,.007,.012],rev:[.85,.95,1],ind:[1,.025,.001],indRed:[1,.007,.012]};
const TWIN_RADIUS=.39415;

// ---- bound parts (resolved by name)
const nodes=new Map(),rest=new Map(),mats=new Map();
let model=null,twin={wheels:[],paints:[]},wheelPre=null,solarTex=null;
const node=n=>nodes.get(n);
const eachMat=(n,f)=>{for(const m of mats.get(n)||[])f(m)};
const AX=new THREE.Vector3(1,0,0),AY=new THREE.Vector3(0,1,0),_q=new THREE.Quaternion();
const rot=(n,axis,rad)=>{const o=node(n),r=o&&rest.get(o);if(!o||!r)return;_q.setFromAxisAngle(axis,rad);o.quaternion.copy(r.q).multiply(_q)};      // absolute: the imported rest rotation, then this turn about the part's own axis
const move=(n,x,y,z)=>{const o=node(n),r=o&&rest.get(o);if(!o||!r)return;o.position.set(r.p.x+x,r.p.y+y,r.p.z+z)};
const emitCache={};
const em=(n,c,k)=>{const x=c[0]*k,y=c[1]*k,z=c[2]*k,o=emitCache[n];if(o&&o[0]===x&&o[1]===y&&o[2]===z)return;emitCache[n]=[x,y,z];eachMat(n,m=>{if(m.emissive){m.emissive.setRGB(x,y,z);m.emissiveIntensity=1}})};

// ---- paint: sRGB hex -> linear, then 0.022 + 0.978 * value once per channel (the GLB's default paint is already lifted); calm matte finish
const _c=new THREE.Color();let paintKey='';
function paint(){
  const id=String(st.paint||'').toLowerCase().replace(/grey/g,'gray').replace(/[^a-z0-9#]+/g,'-').replace(/^-|-$/g,'');
  const p=twin.paints.find(q=>q.id===id);
  const hex=p?p.hex:(/^#[0-9a-f]{6}$/i.test(st.paint)?st.paint:'#a5adb6');
  const metal=Math.min(.12,p?p.metallic:.1),rough=Math.max(.7,p?p.roughness:.76);
  const k=hex+metal+rough;if(k===paintKey)return;paintKey=k;
  _c.set(hex);const r=.022+.978*_c.r,g=.022+.978*_c.g,b=.022+.978*_c.b;
  eachMat('Paint_Body',m=>{m.color.setRGB(r,g,b);m.metalness=metal;m.roughness=rough;if('clearcoat'in m)m.clearcoat=0})}

// ---- wheels: one family per hub, accent finish on its own material only; tyre radius sets spin and ride height
function wheels(){
  const w=twin.wheels.find(q=>q.id===st.wheel)||twin.wheels[0];if(!w||w===wheelPre)return;wheelPre=w;
  for(const c of['FL','FR','RL','RR'])for(const f of['F3','F5','F6','F7']){const n=node('WheelStyle_'+f+'_'+c);if(n){n.visible=f===w.family;n.scale.set(1,1,1)}}
  eachMat(w.accent_material,m=>{m.color.set(w.accent_hex);m.roughness=w.accent_roughness});dirty=true}

// ---- openings: the contract's four doors, hatch, front roof panel and handles; smoothed 180 ms, absolute offsets from the rest pose
const open={fl:0,fr:0,rl:0,rr:0,tg:0,sr:0,hd:0};
const fr=x=>Number.isFinite(x)&&x>0?Math.min(1,x):0;
let openMoving=false;
function openings(dt,snap){
  const T={fl:fr(st.open.fl),fr:fr(st.open.fr),rl:fr(st.open.rl),rr:fr(st.open.rr),tg:fr(st.open.tg),sr:fr(st.open.sr),hd:fr(st.open.hd)};
  const b=snap?1:1-Math.exp(-Math.min(.05,dt)/.18);openMoving=false;
  for(const k in T){open[k]+=(T[k]-open[k])*b;if(Math.abs(T[k]-open[k])<.001)open[k]=T[k];else openMoving=true}
  const D=Math.PI/180;
  rot('Hinge_Door_FL',AY,-68*D*open.fl);rot('Hinge_Door_FR',AY,68*D*open.fr);rot('Hinge_Door_RL',AY,-68*D*open.rl);rot('Hinge_Door_RR',AY,68*D*open.rr);
  rot('Hinge_Tailgate',AX,-82*D*open.tg);
  move('Slide_Handle_FL',-.035*open.hd,0,0);move('Slide_Handle_RL',-.035*open.hd,0,0);move('Slide_Handle_FR',.035*open.hd,0,0);move('Slide_Handle_RR',.035*open.hd,0,0);
  const lift=Math.min(1,open.sr/.18),slide=Math.max(0,Math.min(1,(open.sr-.18)/.82));
  move('Slide_Sunroof_Front',0,.06*lift,.922*slide)}

// ---- solar roof: ONE small texture shared by every instance of both solar materials (so by both roof halves); the colour field never restarts at the seam.
// Power colour scale (as the car's own SolarSky screen): 0 W green -> cyan -> orange / red at the configured full-scale power (250 W). While the roof makes power, a pulse of that colour
// runs along the circuit traces from the two outer ends of the roof toward the middle (u is continuous along the roof, so "distance from the nearest end" is the same on both halves).
const NEUTRAL=new THREE.Color('#293b48'),_t=new THREE.Color(),_s=new THREE.Color();let cellTex=null,solarKey='',solarOn=false,lastSolar=0,solPh=0,solClk=0,solF=0;
const SCALE=[[0,'#1cff2a'],[.12,'#1cff2a'],[.26,'#00d2ff'],[.62,'#00d2ff'],[.70,'#ff9a00'],[1,'#ff2a00']].map(a=>[a[0],new THREE.Color(a[1])]);
function scaleColor(f,out){let i=1;while(i<SCALE.length-1&&f>SCALE[i][0])i++;const a=SCALE[i-1],b=SCALE[i];return out.copy(a[1]).lerp(b[1],Math.max(0,Math.min(1,(f-a[0])/(b[0]-a[0]))))}
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function solar(now){
  if(!solarTex)return;
  const p=st.solar,ok=Number.isFinite(p)&&p>=0,f=ok?Math.min(1,p):0;solarOn=ok&&f>.004;
  // The sweep is driven by an accumulated phase (it only ever moves forward) and by a smoothed power value, so a change of power speeds the pulse up or slows it down
  // gradually. (It used to be time / period: any small change of the period moved the phase by whole sweeps, which looked like the pulse jumping back and forth.)
  const dtS=Math.min(.2,Math.max(0,((now||0)-solClk)/1000));solClk=now||0;
  if(!solarOn)solF=f;else solF+=(f-solF)*(1-Math.exp(-dtS/.6));
  const fs=solF,T=2.6-.9*fs;
  if(solarOn)solPh=(solPh+dtS/T)%1;
  const ph=solPh*1.3;                                           // faster pulses at higher power; a short rest between sweeps
  const k=ok?(solarOn?fs.toFixed(3)+'|'+(ph*90|0):'z'+f):'n';
  if(k===solarKey)return;solarKey=k;
  const d=solarTex.image.data;scaleColor(fs,_s);
  const dc=cellTex.image.data;
  for(let x=0;x<256;x++){
    // the traces (shared texture): dim line colour, with the pulse running over it
    if(!solarOn)_t.copy(NEUTRAL).multiplyScalar(VIEWER?.9:.22);   // no power (0 W or no signal): nothing lit, no colour
    else{const u=x/255,dd=Math.min(u,1-u)*2,e=(dd-ph)/(VIEWER?.10:.14),I=Math.exp(-e*e)*(1-sm(.95,1.3,ph));
      _t.copy(NEUTRAL).multiplyScalar(VIEWER?.9:.22).lerp(_s,Math.min(1,I*(VIEWER?1:1.05)));_t.lerp(new THREE.Color(1,1,1),I*.08)}     // faint grey-blue at rest; the power colour only where the pulse runs
    _t.convertLinearToSRGB();
    for(let y=0;y<2;y++){const i=(y*256+x)*4;d[i]=Math.round(_t.r*255);d[i+1]=Math.round(_t.g*255);d[i+2]=Math.round(_t.b*255);d[i+3]=255}
    // the cells: one steady colour, no animation
    _t.copy(NEUTRAL).convertLinearToSRGB();      // the cells never take the power colour: only the circuit lines do
    for(let y=0;y<2;y++){const i=(y*256+x)*4;dc[i]=Math.round(_t.r*255);dc[i+1]=Math.round(_t.g*255);dc[i+2]=Math.round(_t.b*255);dc[i+3]=255}}
  cellTex.needsUpdate=true;
  solarTex.needsUpdate=true;dirty=true}
function mkTex(){const t=new THREE.DataTexture(new Uint8Array(256*2*4),256,2,THREE.RGBAFormat);t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=t.minFilter=THREE.LinearFilter;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.generateMipmaps=false;return t}
// ---- front roof circuit lines: redrawn to the car's own SolarSky picture (the supplied front pattern differs from the car's: eight evenly spaced lines, nested U links and a notch).
// Drawn on the same surface and with the same UV mapping as the supplied overlay (u runs front to back along z), as thin ribbons the width of the supplied lines.
function redrawFrontTraces(){
  const o=node('SolarOverlay_Front');if(!o||!o.isMesh)return;
  const W=.0023,Y=(x,z)=>1.60752+.07945*z-.24922*z*z+.2028*z*z*z-.01072*x*x+.06852*x*x*z-.00298*Math.abs(x)+.0014;
  const zOf=px=>-.28007+(px-120)/370*.83416,xOf=py=>.4256-(py-95)/367*.8462;
  const R=[];for(let k=0;k<8;k++)R.push(95+52.43*k);
  const segs=[];        // [x0,x1,z0,z1] as ribbons
  const Hs=(p0,p1,r)=>{const x=xOf(R[r]);segs.push([x-W,x+W,zOf(p0)-W,zOf(p1)+W])};         // runs along the car (windshield -> back)
  const Vs=(p,r0,r1)=>{const z=zOf(p),a=xOf(typeof r0==='number'&&r0<8?R[r0]:r0),b=xOf(typeof r1==='number'&&r1<8?R[r1]:r1);segs.push([Math.min(a,b)-W,Math.max(a,b)+W,z-W,z+W])};
  const stub=45;
  Hs(185,487,0);Vs(487,0,R[0]+stub);
  Hs(218,432,1);Vs(432,1,2);Hs(432,487,2);Vs(487,2,5);Hs(432,487,5);Vs(432,5,6);Hs(218,432,6);
  Hs(165,380,2);Vs(380,2,3);Hs(380,432,3);Vs(432,3,4);Hs(380,432,4);Vs(380,4,5);Hs(165,380,5);
  Hs(218,325,3);Vs(325,3,4);Hs(218,325,4);
  Hs(185,487,7);Vs(487,7,R[7]-stub);
  const starts=[185,218,165,218,218,165,218,185];
  for(let k=0;k<8;k++)for(let px=122;px<starts[k]-9;px+=17){const x=xOf(R[k]),z=zOf(px);segs.push([x-W,x+W,z-W,z+W])}
  const P=[],U=[],Ix=[];let n=0;
  const uOf=z=>.0082812+(z+.28007447)*.5083,vOf=x=>.8825966-(x+.4228861)*.8985;
  const vert=(x,z)=>{P.push(x,Y(x,z),z);U.push(uOf(z),vOf(x));return n++};
  for(const [x0,x1,z0,z1] of segs){
    const nz=Math.max(1,Math.ceil((z1-z0)/.08)),nx=Math.max(1,Math.ceil((x1-x0)/.12));
    for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
      const xa=x0+(x1-x0)*i/nx,xb=x0+(x1-x0)*(i+1)/nx,za=z0+(z1-z0)*j/nz,zb=z0+(z1-z0)*(j+1)/nz;
      const a=vert(xa,za),b=vert(xa,zb),c=vert(xb,zb),d=vert(xb,za);Ix.push(a,b,c,a,c,d)}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  const N=[];for(let i=0;i<n;i++)N.push(0,1,0);g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));g.setIndex(Ix);
  o.geometry.dispose();o.geometry=g}


// ---- rear roof: the dotted line starts get the same pattern as the front ones (same spacing and length, running in from the rear edge); the circuit lines end where the dots begin
function redrawRearDots(){
  const o=node('SolarOverlay_Rear');if(!o||!o.isMesh||!o.geometry.index)return;
  const g=o.geometry,P=g.attributes.position.array,UV=g.attributes.uv.array,cnt=g.attributes.position.count,Ix=g.index.array;
  const Q=[];let zmax=-1e9;
  for(let q=0;q+3<cnt;q+=4){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(let i=0;i<4;i++){const x=P[(q+i)*3],z=P[(q+i)*3+2];x0=Math.min(x0,x);x1=Math.max(x1,x);z0=Math.min(z0,z);z1=Math.max(z1,z);zmax=Math.max(zmax,z)}Q.push({q,x0,x1,z0,z1})}
  const dot=a=>a.x1-a.x0<.012&&a.z1-a.z0<.012,vert=a=>a.x1-a.x0<.012&&a.z1-a.z0>=.012;
  const col=a=>Math.round((a.x0+a.x1)/2/.004),smp=new Map();
  for(const a of Q)if(a.x1-a.x0<.012){const k=col(a);if(!smp.has(k))smp.set(k,[]);for(let i=0;i<4;i++)smp.get(k).push([P[(a.q+i)*3+2],P[(a.q+i)*3+1]])}
  for(const l of smp.values())l.sort((a,b)=>a[0]-b[0]);
  const yAt=(k,z)=>{const l=smp.get(k);if(!l||l.length<2)return 0;let i=1;while(i<l.length-1&&l[i][0]<z)i++;const a=l[i-1],b=l[i],d=b[0]-a[0];return d<1e-6?a[1]:a[1]+(b[1]-a[1])*(z-a[0])/d};
  const W=.0023,PITCH=17/370*.83416,ZEND=zmax-(185-120)/370*.83416;      // the front's dots: a 17 px pitch, lines starting 65 px in from the edge
  const NP=[],NU=[],NI=[];let n=0;
  const uOf=z=>.0082812+(z+.28007447)*.5083,vOf=x=>.8825966-(x+.4228861)*.8985;
  for(const a of Q){if(dot(a))continue;
    const cut=vert(a)&&a.z1>zmax-.075;
    for(let i=0;i<4;i++){const j=(a.q+i)*3;let z=P[j+2],y=P[j+1];if(cut&&z>zmax-.075){z=ZEND;y=yAt(col(a),ZEND)}NP.push(P[j],y,z);NU.push(UV[(a.q+i)*2],UV[(a.q+i)*2+1])}
    const b=n;n+=4;const qi=Q.indexOf(a)*6;
    for(let t=0;t<6;t++)NI.push(b+(Ix[qi+t]-a.q))}
  const keys=new Set();for(const a of Q)if(vert(a)&&a.z1>zmax-.075)keys.add(col(a));
  for(const k of keys){const xc=k*.004;
    for(let i=0;i<4;i++){const zc=zmax-.0045-i*PITCH,xa=xc-W,xb=xc+W,za=zc-W,zb=zc+W;
      const b=n;for(const [x,z] of [[xa,za],[xa,zb],[xb,zb],[xb,za]]){NP.push(x,yAt(k,z),z);NU.push(uOf(z),vOf(x))}n+=4;
      const ay=(NP[(b+1)*3+2]-NP[b*3+2])*(NP[(b+2)*3]-NP[b*3])-(NP[(b+1)*3]-NP[b*3])*(NP[(b+2)*3+2]-NP[b*3+2]);
      if(ay>0)NI.push(b,b+1,b+2,b,b+2,b+3);else NI.push(b,b+2,b+1,b,b+3,b+2)}}
  const N=[];for(let i=0;i<n;i++)N.push(0,1,0);
  const h=new THREE.BufferGeometry();h.setAttribute('position',new THREE.Float32BufferAttribute(NP,3));h.setAttribute('uv',new THREE.Float32BufferAttribute(NU,2));h.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));h.setIndex(NI);
  g.dispose();o.geometry=h}

// small dash view: the lines are a centimetre or two wide on a car a hundred-odd pixels long, so they are drawn wider there (same paths) to stay visible
function thickenLines(k){
  for(const n of['SolarOverlay_Front','SolarOverlay_Rear']){const o=node(n);if(!o||!o.isMesh)continue;
    const P=o.geometry.attributes.position,a=P.array;
    for(let q=0;q+3<P.count;q+=4){
      let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(let i=0;i<4;i++){const x=a[(q+i)*3],z=a[(q+i)*3+2];x0=Math.min(x0,x);x1=Math.max(x1,x);z0=Math.min(z0,z);z1=Math.max(z1,z)}
      const cx=(x0+x1)/2,cz=(z0+z1)/2,sx=(x1-x0)<.012?k:1,sz=(z1-z0)<.012?k:1;
      for(let i=0;i<4;i++){const j=(q+i)*3;a[j]=cx+(a[j]-cx)*sx;a[j+2]=cz+(a[j+2]-cz)*sz}}
    P.needsUpdate=true}}

function setupSolar(){
  solarTex=mkTex();cellTex=mkTex();
  const old=new Set();
  eachMat('Mat_SolarPower',m=>{if(m.map&&m.map!==solarTex)old.add(m.map);m.map=solarTex;m.emissive.setRGB(1,1,1);m.emissiveMap=solarTex;m.emissiveIntensity=VIEWER?2.6:6;m.toneMapped=false;m.needsUpdate=true});   // lit by itself, so the lines stay vivid on the small car
  eachMat('Mat_SolarCells',m=>{if(m.map&&m.map!==cellTex)old.add(m.map);m.map=cellTex;m.emissive.setRGB(1,1,1);m.emissiveMap=cellTex;m.emissiveIntensity=.12;m.needsUpdate=true});   // the cells keep their own steady colour: only the lines animate
  for(const t of old)t.dispose();solarKey='';solar(performance.now())}

// ---- lamps: contract emission values per material; the car's own indicator flash is used as is (no second blink)
const beams={Dipped:[],High:[]},glows={};
function lamps(){if(st.bglow!==glowMode)applyGlowMode();
  const head=st.head,dip=head===1||head===2,high=head===2,drl=head===3;
  const front=dip?L.dip+(high?L.high:0):(drl?L.dip*DRL_LAMP:0);
  for(const s of['L','R']){em('Mat_Head_'+s,C.head,front);em('Mat_Tail_'+s,C.tail,st.brake?L.brake:(st.tail?L.tail:0));em('Mat_Reverse_'+s,C.rev,st.rev?L.rev:0)}
  em('Mat_Brake_Centre',C.tail,st.brake?L.centre:0);

// driving (small view only): the body narrows from partway along toward the nose, as on the previous model (BODY_K at the nose, starting BODY_S of the way from the rear); the front wheels and beams follow it in

  const wantYaw=!st.follow?0:Math.max(-YAW_MAX,Math.min(YAW_MAX,st.turn*YAW_K));       // the car body turns toward the road bend (positive = right here)
