name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build CAN helper for the Pulse (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd canbridge
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libcanbridge.so main.go
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Load the signing key from the repository secrets
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/buddy.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/buddy.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets; this build is signed with a temporary key and cannot update an installed copy."
          fi
      - run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: FiskerBattery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Attach the APK to a GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NAME="FiskerBattery-build${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          # release notes: the commit message without the trailer lines (Claude-Session, Co-Authored-By)
          MSG=$(git log -1 --pretty=%B | grep -v -i -E '^(Claude-Session|Co-Authored-By):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | head -c 1500)
          # builds after #351 are untested: say so at the top of every release's notes
          WARN="WARNING: builds beyond #351 are NOT tested. Use at your own risk. Recommend staying on build #351 for now."
          MSG="$WARN"$'\n\n'"$MSG"
          gh release create "build-${{ github.run_number }}" "$NAME" --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" --notes "$MSG" --prerelease
