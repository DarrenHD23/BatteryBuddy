name: Clean release notes
# One-off: removes the Claude-Session / Co-Authored-By trailer lines from every release's notes.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clean-release-notes.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clean the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q '.[] | select(.body|test("Claude-Session|Co-Authored-By")) | .id'); do
            body=$(gh api repos/${{ github.repository }}/releases/$id -q .body | tr -d '\r' | grep -v -i -E '^(Claude-Session|Co-Authored-By):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
            gh api -X PATCH repos/${{ github.repository }}/releases/$id -f body="$body" > /dev/null && n=$((n+1))
          done
          echo "cleaned $n releases"
